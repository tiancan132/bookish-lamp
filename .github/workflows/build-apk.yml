name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for CAND in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$CAND" ]; then SDK_ROOT="$CAND"; break; fi
            done
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 准备 Gradle Wrapper
        working-directory: SmoothCensor
        run: |
          curl -fsSL --retry 3 --max-time 180 -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          mkdir -p gradle/wrapper
          curl -fsSL --retry 3 --max-time 180 -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: 下载 AI 模型
        working-directory: SmoothCensor/app/src/main/assets
        run: |
          if [ -f "320n.onnx" ]; then exit 0; fi
          curl -fsSL --retry 3 --max-time 600 -o 320n.onnx "https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/320n.onnx"
          stat -c%s 320n.onnx

      - name: 写入 local.properties
        working-directory: SmoothCensor
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 编译 Debug APK
        working-directory: SmoothCensor
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SmoothCensor-debug-apk
          path: SmoothCensor/app/build/outputs/apk/debug/*.apk
