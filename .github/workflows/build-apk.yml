name: Build APK

# 什么时候自动编译：
#   1. 你手动点按钮触发
#   2. 每次 push 代码
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'SmoothCensor/**'
      - '.github/workflows/**'

jobs:
  build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 取出代码 ----------
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 2. 装 JDK 17 ----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 3. 配置 Android SDK ----------
      # 不用第三方 action（那个以前经常失败），改用 runner 自带的 SDK。
      # ubuntu-latest 镜像里已经预装了 Android SDK，只要设好环境变量即可。
      - name: 配置 Android SDK
        run: |
          set -e
          echo "=== 查找预装的 Android SDK ==="
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for CAND in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$CAND" ]; then SDK_ROOT="$CAND"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "❌ 找不到 Android SDK"
            exit 1
          fi
          echo "SDK 位置: $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT"     >> "$GITHUB_ENV"
          echo "=== 已有组件 ==="
          ls "$SDK_ROOT" || true
          echo "=== 可用 platform 版本 ==="
          ls "$SDK_ROOT/platforms" 2>/dev/null || echo "(platforms 目录为空)"
          echo "=== build-tools ==="
          ls "$SDK_ROOT/build-tools" 2>/dev/null || echo "(build-tools 目录为空)"

      # ---------- 3b. 确保 API 34 平台和构建工具存在 ----------
      - name: 安装缺失的 SDK 组件
        run: |
          set -e
          SDK_ROOT="$ANDROID_SDK_ROOT"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMDLINE" ]; then
            # 试一下旧版路径
            CMDLINE=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          fi

          if [ -z "$CMDLINE" ] || [ ! -x "$CMDLINE" ]; then
            echo "⚠️ 找不到 sdkmanager，跳过组件安装"
            echo "→ 如果后面编译失败是缺少 platform 34，再回来处理"
            exit 0
          fi

          echo "sdkmanager: $CMDLINE"
          yes | "$CMDLINE" --licenses > /dev/null 2>&1 || true
          "$CMDLINE" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true
          echo "=== 安装后 ==="
          ls "$SDK_ROOT/platforms" 2>/dev/null || echo "(仍然为空)"

      # ---------- 4. 缓存 Gradle，加快下次编译 ----------
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('SmoothCensor/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- 5. 准备 Gradle Wrapper ----------
      # 仓库里没有 gradlew，所以用 runner 自带的 Gradle 生成一个，
      # 再交给 gradlew 执行，保证版本固定。
      - name: 生成 Gradle Wrapper
        working-directory: SmoothCensor
        run: |
          if [ ! -f gradlew ]; then
            echo "→ 没有 gradlew，正在生成…"
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "→ 已有 gradlew"
          fi
          chmod +x gradlew
          cat gradle/wrapper/gradle-wrapper.properties

      # ---------- 6. 准备模型文件 ----------
      # 模型有 18MB，直接放进仓库会让上传很慢。
      # 这里让编译机自己去下载，仓库里只放代码。
      - name: 下载 AI 模型
        working-directory: SmoothCensor/app/src/main/assets
        run: |
          set -e

          # 已经有模型就直接用（兼容手动放进来的情况）
          if [ -f "320n.onnx" ] || [ -f "320n_fp16.onnx" ]; then
            echo "→ 模型已存在，跳过下载"
            ls -la
            exit 0
          fi

          echo "→ 尝试下载模型…"
          # NudeNet 官方发布的 320n 模型
          # 期望大小 12,150,158 字节
          for U in \
            "https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/320n.onnx" \
            "https://github.com/notAI-tech/NudeNet/releases/download/v3.2-weights/360n.onnx"
          do
            echo "  尝试: $U"
            rm -f "downloaded.onnx"
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 600 -o "downloaded.onnx" "$U"; then
              SIZE=$(stat -c%s "downloaded.onnx" 2>/dev/null || stat -f%z "downloaded.onnx")
              echo "  下载到 $SIZE 字节"
              # 必须大于 1MB 才是真模型；小于就是错误页
              if [ "$SIZE" -gt 1000000 ]; then
                # 再确认不是 HTML 错误页
                if head -c 15 "downloaded.onnx" | grep -q "DOCTYPE"; then
                  echo "  ⚠️ 拿到的是网页而不是模型，换下一个源"
                  rm -f "downloaded.onnx"
                else
                  echo "  ✅ 下载成功 ($((SIZE/1024/1024)) MB)"
                  mv "downloaded.onnx" "320n.onnx"
                  break
                fi
              else
                echo "  ⚠️ 文件太小，换下一个源"
                rm -f "downloaded.onnx"
              fi
            fi
          done

          if [ ! -f "320n.onnx" ]; then
            echo "❌ 模型下载失败"
            echo "→ 你需要手动把模型文件放进仓库的 SmoothCensor/app/src/main/assets/ 目录"
            exit 1
          fi

          # 校验大小，确保拿到的是真模型而不是半截文件
          FINAL=$(stat -c%s "320n.onnx")
          echo "→ 最终模型大小: $FINAL 字节 (期望约 12150158)"
          if [ "$FINAL" -lt 5000000 ]; then
            echo "❌ 模型文件不完整"
            exit 1
          fi

          # 注意：这里不生成 fp16 副本。
          # 直接复制一份 fp32 只会让 APK 白白大一倍，没有任何好处。
          # 代码里优先找 fp16，找不到会自动回退用 320n.onnx。
          echo "→ 只保留 320n.onnx，代码会自动回退使用它"
          ls -la

      # ---------- 7. 开始编译 ----------
      - name: 写入 local.properties
        working-directory: SmoothCensor
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: 编译 Debug APK
        working-directory: SmoothCensor
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ---------- 8. 上传产物 ----------
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SmoothCensor-debug-apk
          path: SmoothCensor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- 9. 编译失败时打印日志 ----------
      - name: 失败时显示报告
        if: failure()
        working-directory: SmoothCensor
        run: |
          echo "=== 编译失败，下面是诊断信息 ==="
          find . -name "*.log" -o -name "lint-results*" 2>/dev/null | head -20
